<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Meet your new AI Teammates</title>
<style>
  html, body { margin:0; height:100%; background:#050505; color:#f4efe4; font-family:Calibri, Arial, sans-serif; }
  .slide { min-height:100vh; display:flex; align-items:center; padding:8vh 8vw; box-sizing:border-box; position:relative; overflow:hidden; }
  .mark { position:absolute; top:6vh; left:8vw; display:flex; align-items:center; gap:14px; font-size:28px; font-weight:700; }
  .dot { width:36px; height:36px; border-radius:50%; background:#f5f0e6; }
  h1 { font-size:72px; line-height:1.05; margin:0; font-weight:700; }
  .purple { color:#8b5cf6; }
  p { margin:28px 0 0; font-size:24px; color:#c8c8c4; }
  .blob { position:absolute; border-radius:50%; }
  .eyes:before, .eyes:after { content:""; position:absolute; top:38%; width:18px; height:28px; background:#1a1020; border-radius:50%; }
  .eyes:before { left:38%; } .eyes:after { right:38%; }
  .b1 { width:280px; height:300px; background:#8b5cf6; right:-40px; top:-80px; }
  .b2 { width:260px; height:280px; background:#f43fbe; right:-20px; top:220px; }
  .b3 { width:260px; height:280px; background:#3b82f6; left:-80px; bottom:-80px; }
  .b4 { width:250px; height:290px; background:#f97316; left:42%; bottom:-90px; }
  .b5 { width:250px; height:280px; background:#22c55e; right:18%; bottom:-80px; }
</style>
</head>
<body>
<section class="slide">
  <div class="mark"><span class="dot"></span> ValtienceAI</div>
  <div>
    <h1>Meet your new.</h1>
    <h1 class="purple">AI Teammates</h1>
    <p>Integrated with ValtienceAI (ValOS).</p>
  </div>
  <div class="blob b1 eyes"></div>
  <div class="blob b2 eyes"></div>
  <div class="blob b3 eyes"></div>
  <div class="blob b4 eyes"></div>
  <div class="blob b5 eyes"></div>
</section>
</body>
</html>
